name: Build 百宏RDP Test20 Konka Win7 Defaults APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and lint Test20 Konka Android9 Win7 defaults
        shell: bash
        run: bash scripts/build_konka_test20.sh

      - name: Upload Test20 APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAIHONG-RDP-KONKA32-Test20
          path: output/
          if-no-files-found: error
          retention-days: 30
