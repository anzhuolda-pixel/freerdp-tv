name: Build FreeRDP TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      FREERDP_COMMIT: "50c9f7470d9da3a45e1ebb5ee5fba14140c3fbb3"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
      ANDROID_HOME: "/usr/local/lib/android/sdk"

    steps:
      - name: Checkout TV build files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install host build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git perl make ninja-build pkg-config python3 \
            autoconf automake libtool gettext

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;4.1.2"

      - name: Checkout pinned FreeRDP source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf upstream
          mkdir upstream
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/FreeRDP/FreeRDP.git
          git -C upstream fetch --depth=1 origin "$FREERDP_COMMIT"
          git -C upstream checkout -q FETCH_HEAD

      - name: Apply Android 9 TV Test3 patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/patch_freerdp_tv_test3.py
          python3 scripts/patch_freerdp_tv_test3.py upstream
          STUDIO=upstream/client/Android/Studio
          sed -i 's/^COMPILE_API=.*/COMPILE_API=36/' "$STUDIO/release.properties"
          sed -i 's/^TOOLS_VERSION=.*/TOOLS_VERSION=36.0.0/' "$STUDIO/release.properties"
          sed -i "s/androidx.core:core:1.19.0/androidx.core:core:1.18.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.lifecycle:lifecycle-viewmodel:2.11.0/androidx.lifecycle:lifecycle-viewmodel:2.10.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.lifecycle:lifecycle-livedata:2.11.0/androidx.lifecycle:lifecycle-livedata:2.10.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/sqlcipher-android:4.17.0/sqlcipher-android:4.16.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.sqlite:sqlite:2.7.0/androidx.sqlite:sqlite:2.6.2/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "/implementation project(':freeRDPCore')/a\\    implementation 'androidx.appcompat:appcompat:1.7.1'\n    implementation 'androidx.preference:preference:1.2.1'" "$STUDIO/aFreeRDP/build.gradle"
          cat "$STUDIO/release.properties"
          grep -E "androidx.core:core|lifecycle-|sqlcipher|androidx.sqlite" "$STUDIO/freeRDPCore/build.gradle"
          cat "$STUDIO/aFreeRDP/build.gradle"

      - name: Build installable debug APK
        shell: bash
        working-directory: upstream/client/Android/Studio
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :aFreeRDP:assembleDebug

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          APK="$(find upstream/client/Android/Studio/aFreeRDP/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" output/FreeRDP-TV-3.31.1-Android9-Test3.apk
          sha256sum output/FreeRDP-TV-3.31.1-Android9-Test3.apk | tee output/SHA256.txt
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$AAPT" dump badging output/FreeRDP-TV-3.31.1-Android9-Test3.apk | tee output/APK_BADGING.txt
          grep -q "sdkVersion:'28'" output/APK_BADGING.txt
          grep -q "arm64-v8a" output/APK_BADGING.txt
          grep -q "armeabi-v7a" output/APK_BADGING.txt
          {
            echo "Base: FreeRDP 3.31.1"
            echo "Variant: Android 9 TV Test3"
            echo "minSdk: 28"
            echo "ABIs: armeabi-v7a + arm64-v8a"
            echo "RDP: enabled"
            echo "RemoteApp/RAIL: enabled by default"
            echo "Multiple saved profiles: enabled"
            echo "Explicit automatic connection target: enabled"
            echo "Start app after TV boot: optional"
            echo "Boot-start and auto-connect are independent"
          } > output/BUILD_INFO.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeRDP-TV-Android9-Test3
          path: output/
          if-no-files-found: error
          retention-days: 30
