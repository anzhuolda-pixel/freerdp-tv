name: Build BILLION RDP REMOTE Adaptive APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      FREERDP_COMMIT: "50c9f7470d9da3a45e1ebb5ee5fba14140c3fbb3"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      TEST_CERT_SHA256: "373fd206b9067e401b4e9d0d37ace98bf03a8f08b4f1c435af02e5ca5e6e52f4"

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install host build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git perl make ninja-build pkg-config python3 python3-pip autoconf automake libtool gettext zip unzip
          python3 -m pip install --break-system-packages "cryptography==46.0.4"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;4.1.2"

      - name: Checkout pinned FreeRDP source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf upstream
          mkdir upstream
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/FreeRDP/FreeRDP.git
          git -C upstream fetch --depth=1 origin "$FREERDP_COMMIT"
          git -C upstream checkout -q FETCH_HEAD

      - name: Apply Android 9 adaptive Test13 patches
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/patch_freerdp_tv_test3.py
          python3 -m py_compile scripts/patch_adaptive_test4.py
          python3 -m py_compile scripts/patch_brand_ux_test5.py
          python3 -m py_compile scripts/patch_billion_brand_test6.py
          python3 -m py_compile scripts/patch_ux_errors_test7.py
          python3 -m py_compile scripts/patch_remove_about_test8.py
          python3 -m py_compile scripts/patch_tv_focus_display_test9.py
          python3 -m py_compile scripts/patch_stability_test10.py
          python3 -m py_compile scripts/patch_tv_always_on_test11.py
          python3 -m py_compile scripts/patch_tv_remote_hd_test12.py
          python3 -m py_compile scripts/patch_chinese_ui_test13.py
          python3 -m py_compile scripts/generate_test_signing.py

          python3 scripts/patch_freerdp_tv_test3.py upstream

          STUDIO=upstream/client/Android/Studio
          sed -i 's/^COMPILE_API=.*/COMPILE_API=36/' "$STUDIO/release.properties"
          sed -i 's/^TOOLS_VERSION=.*/TOOLS_VERSION=36.0.0/' "$STUDIO/release.properties"
          sed -i "s/androidx.core:core:1.19.0/androidx.core:core:1.18.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.lifecycle:lifecycle-viewmodel:2.11.0/androidx.lifecycle-viewmodel:2.10.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.lifecycle:lifecycle-livedata:2.11.0/androidx.lifecycle:lifecycle-livedata:2.10.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/sqlcipher-android:4.17.0/sqlcipher-android:4.16.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.sqlite:sqlite:2.7.0/androidx.sqlite:sqlite:2.6.2/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "/implementation project(':freeRDPCore')/a\\    implementation 'androidx.appcompat:appcompat:1.7.1'\n    implementation 'androidx.preference:preference:1.2.1'" "$STUDIO/aFreeRDP/build.gradle"

          python3 scripts/patch_adaptive_test4.py upstream
          python3 scripts/patch_brand_ux_test5.py upstream
          python3 scripts/patch_billion_brand_test6.py upstream
          python3 scripts/patch_ux_errors_test7.py upstream
          python3 scripts/patch_remove_about_test8.py upstream
          python3 scripts/patch_tv_focus_display_test9.py upstream
          python3 scripts/patch_stability_test10.py upstream
          python3 scripts/patch_tv_always_on_test11.py upstream
          python3 scripts/patch_tv_remote_hd_test12.py upstream
          python3 scripts/patch_chinese_ui_test13.py upstream

          python3 scripts/generate_test_signing.py "$STUDIO/billion-rdp-test.p12" | tee /tmp/signing.txt
          grep -F "CERT_SHA256=$TEST_CERT_SHA256" /tmp/signing.txt
          keytool -list -storetype PKCS12 -keystore "$STUDIO/billion-rdp-test.p12" -storepass BillionRdpTest10 -alias billion-rdp >/dev/null

          grep -F "VERSION_NAME=3.31.1-billion-a9-test13" "$STUDIO/release.properties"
          grep -F 'android:name="android.hardware.camera" android:required="false"' "$STUDIO/aFreeRDP/src/main/AndroidManifest.xml"
          grep -F 'android:name="android.hardware.microphone" android:required="false"' "$STUDIO/aFreeRDP/src/main/AndroidManifest.xml"
          grep -F '电视大屏持续显示保护' "$STUDIO/freeRDPCore/src/main/res/values-zh/strings.xml"
          grep -F '电视大屏高清显示优化' "$STUDIO/freeRDPCore/src/main/res/values-zh/strings.xml"
          grep -F '再按一次返回键断开远程连接' "$STUDIO/freeRDPCore/src/main/res/values-zh/strings.xml"
          grep -F '确定要退出 BILLION RDP REMOTE 吗？' "$STUDIO/freeRDPCore/src/main/res/values-zh/strings.xml"
          ! grep -Fq '@+id/help' "$STUDIO/freeRDPCore/src/main/res/menu/home_menu.xml"
          ! grep -Fq '.presentation.HelpActivity' "$STUDIO/freeRDPCore/src/main/AndroidManifest.xml"
          grep -F 'KEYCODE_DPAD_RIGHT' "$STUDIO/freeRDPCore/src/main/java/com/freerdp/freerdpcore/utils/BookmarkListAdapter.java"
          grep -F 'KEYCODE_DPAD_LEFT' "$STUDIO/freeRDPCore/src/main/java/com/freerdp/freerdpcore/utils/BookmarkListAdapter.java"
          grep -F 'tvFlags.setFontSmoothing(true)' "$STUDIO/freeRDPCore/src/main/java/com/freerdp/freerdpcore/presentation/SessionActivity.java"
          grep -F '"/network:lan"' "$STUDIO/freeRDPCore/src/main/java/com/freerdp/freerdpcore/services/LibFreeRDP.java"
          grep -F 'FLAG_KEEP_SCREEN_ON' "$STUDIO/freeRDPCore/src/main/java/com/freerdp/freerdpcore/presentation/SessionActivity.java"
          grep -F 'abiFilters "armeabi-v7a", "arm64-v8a"' "$STUDIO/aFreeRDP/build.gradle"

      - name: Build APK using proven debug variant
        shell: bash
        working-directory: upstream/client/Android/Studio
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace :aFreeRDP:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/output/GRADLE_BUILD.txt"
          STATUS=${PIPESTATUS[0]}
          set -e
          exit "$STATUS"

      - name: Strip debug signature, align, sign v2, and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          STUDIO=upstream/client/Android/Studio
          APK=""
          while IFS= read -r CANDIDATE; do
            if unzip -l "$CANDIDATE" | grep -Fq "lib/arm64-v8a/" && unzip -l "$CANDIDATE" | grep -Fq "lib/armeabi-v7a/"; then
              APK="$CANDIDATE"
              break
            fi
          done < <(find "$STUDIO/aFreeRDP/build/outputs/apk/debug" -type f -name '*.apk' | sort)
          test -n "$APK"

          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          UNSIGNED="output/Test13-signature-stripped.apk"
          ALIGNED="output/Test13-aligned.apk"
          OUT="output/BILLION-RDP-REMOTE-3.31.1-Android9-Adaptive-Test13.apk"

          cp "$APK" "$UNSIGNED"
          zip -q -d "$UNSIGNED" 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/*.MF' || true
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$STUDIO/billion-rdp-test.p12" \
            --ks-type PKCS12 \
            --ks-key-alias billion-rdp \
            --ks-pass pass:BillionRdpTest10 \
            --key-pass pass:BillionRdpTest10 \
            --min-sdk-version 28 \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "$OUT" \
            "$ALIGNED"
          rm -f "$UNSIGNED" "$ALIGNED"

          sha256sum "$OUT" | tee output/SHA256.txt
          "$AAPT" dump badging "$OUT" | tee output/APK_BADGING.txt
          grep -Fq "sdkVersion:'28'" output/APK_BADGING.txt
          grep -Fq "versionName='3.31.1-billion-a9-test13'" output/APK_BADGING.txt
          grep -Fq "application-label:'BILLION RDP REMOTE'" output/APK_BADGING.txt
          grep -Fq "uses-feature-not-required: name='android.hardware.camera'" output/APK_BADGING.txt
          grep -Fq "uses-feature-not-required: name='android.hardware.microphone'" output/APK_BADGING.txt

          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee output/APK_SIGNATURE.txt
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" output/APK_SIGNATURE.txt
          grep -Fiq "$TEST_CERT_SHA256" output/APK_SIGNATURE.txt
          "$ZIPALIGN" -c -v 4 "$OUT" >/dev/null

          unzip -t "$OUT" | tee output/APK_ZIP_TEST.txt
          unzip -l "$OUT" | tee output/APK_FILELIST.txt >/dev/null
          grep -Fq "lib/arm64-v8a/" output/APK_FILELIST.txt
          grep -Fq "lib/armeabi-v7a/" output/APK_FILELIST.txt
          ! grep -Fq "lib/x86/" output/APK_FILELIST.txt
          ! grep -Fq "lib/x86_64/" output/APK_FILELIST.txt
          ! grep -Fq "about_page/" output/APK_FILELIST.txt
          ! grep -Fq "help_page/" output/APK_FILELIST.txt

          {
            echo "Base: FreeRDP 3.31.1"
            echo "Variant: BILLION RDP REMOTE Android 9 Adaptive Test13"
            echo "Compile variant: debug (known-good build path), then signature stripped and final-signed"
            echo "Stable reproducible TEST signing baseline starts at Test10"
            echo "Signing certificate SHA256: $TEST_CERT_SHA256"
            echo "APK Signature Scheme: v2 (native on Android 7+, including Android 9)"
            echo "Test13: Help toolbar/activity/assets removed"
            echo "Test13: Chinese resource audit prevents user-facing English fallback on Chinese systems"
            echo "Test13: exit, disconnect, certificate, connection, sharing, display and settings feedback localized"
            echo "TV D-pad navigation and Test12 HD display policy retained"
            echo "TV continuous-display protection retained"
            echo "Camera/microphone optional; ARMv7 + ARM64 only"
            echo "RDP + RemoteApp/RAIL enabled"
            echo "minSdk 28"
          } > output/BUILD_INFO.txt

      - name: Upload build output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BILLION-RDP-REMOTE-Android9-Adaptive-Test13
          path: output/
          if-no-files-found: error
          retention-days: 30
