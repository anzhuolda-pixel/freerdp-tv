name: Build BILLION RDP REMOTE Adaptive APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      FREERDP_COMMIT: "50c9f7470d9da3a45e1ebb5ee5fba14140c3fbb3"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
      ANDROID_HOME: "/usr/local/lib/android/sdk"

    steps:
      - name: Checkout adaptive build files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install host build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git perl make ninja-build pkg-config python3 \
            autoconf automake libtool gettext

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;4.1.2"

      - name: Checkout pinned FreeRDP source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf upstream
          mkdir upstream
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/FreeRDP/FreeRDP.git
          git -C upstream fetch --depth=1 origin "$FREERDP_COMMIT"
          git -C upstream checkout -q FETCH_HEAD

      - name: Apply Android 9 adaptive Test7 patches
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/patch_freerdp_tv_test3.py
          python3 -m py_compile scripts/patch_adaptive_test4.py
          python3 -m py_compile scripts/patch_brand_ux_test5.py
          python3 -m py_compile scripts/patch_billion_brand_test6.py
          python3 -m py_compile scripts/patch_ux_errors_test7.py
          python3 scripts/patch_freerdp_tv_test3.py upstream

          STUDIO=upstream/client/Android/Studio
          sed -i 's/^COMPILE_API=.*/COMPILE_API=36/' "$STUDIO/release.properties"
          sed -i 's/^TOOLS_VERSION=.*/TOOLS_VERSION=36.0.0/' "$STUDIO/release.properties"
          sed -i "s/androidx.core:core:1.19.0/androidx.core:core:1.18.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.lifecycle:lifecycle-viewmodel:2.11.0/androidx.lifecycle:lifecycle-viewmodel:2.10.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.lifecycle:lifecycle-livedata:2.11.0/androidx.lifecycle:lifecycle-livedata:2.10.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/sqlcipher-android:4.17.0/sqlcipher-android:4.16.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.sqlite:sqlite:2.7.0/androidx.sqlite:sqlite:2.6.2/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "/implementation project(':freeRDPCore')/a\\    implementation 'androidx.appcompat:appcompat:1.7.1'\n    implementation 'androidx.preference:preference:1.2.1'" "$STUDIO/aFreeRDP/build.gradle"

          python3 scripts/patch_adaptive_test4.py upstream
          python3 scripts/patch_brand_ux_test5.py upstream
          python3 scripts/patch_billion_brand_test6.py upstream
          python3 scripts/patch_ux_errors_test7.py upstream

          cat "$STUDIO/release.properties"
          grep -R "BILLION RDP REMOTE" -n "$STUDIO/aFreeRDP/src/main/res" "$STUDIO/freeRDPCore/src/main/res/values" "$STUDIO/freeRDPCore/src/main/res/values-zh"
          grep -F "服务器地址（IP / 主机名）" "$STUDIO/freeRDPCore/src/main/res/values-zh/strings.xml"
          grep -F "rdp_error_wrong_password" "$STUDIO/freeRDPCore/src/main/res/values-zh/strings.xml"
          grep -F "getLastErrorCode" "$STUDIO/freeRDPCore/src/main/java/com/freerdp/freerdpcore/services/LibFreeRDP.java"
          grep -F "RdpFailureMessage" "$STUDIO/freeRDPCore/src/main/java/com/freerdp/freerdpcore/presentation/SessionActivity.java"
          grep -F "always|withText" "$STUDIO/freeRDPCore/src/main/res/menu/bookmark_menu.xml"
          ! grep -Fq 'android:key="bookmark.debug"' "$STUDIO/freeRDPCore/src/main/res/xml/bookmark_settings.xml"
          ! grep -Fq "LibFreeRDP.getVersion" "$STUDIO/freeRDPCore/src/main/java/com/freerdp/freerdpcore/presentation/AboutActivity.java"

      - name: Build installable adaptive APK
        shell: bash
        working-directory: upstream/client/Android/Studio
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :aFreeRDP:assembleDebug

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          APK="$(find upstream/client/Android/Studio/aFreeRDP/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          OUT="output/BILLION-RDP-REMOTE-3.31.1-Android9-Adaptive-Test7.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee output/SHA256.txt

          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$OUT" | tee output/APK_BADGING.txt
          grep -Fq "sdkVersion:'28'" output/APK_BADGING.txt
          grep -Fq "versionName='3.31.1-billion-a9-test7'" output/APK_BADGING.txt
          grep -Fq "application-label:'BILLION RDP REMOTE'" output/APK_BADGING.txt

          unzip -l "$OUT" | tee output/APK_FILELIST.txt >/dev/null
          grep -Fq "lib/arm64-v8a/" output/APK_FILELIST.txt
          grep -Fq "lib/armeabi-v7a/" output/APK_FILELIST.txt

          {
            echo "Base: FreeRDP 3.31.1"
            echo "Variant: BILLION RDP REMOTE Android 9 Adaptive Test7"
            echo "App label: BILLION RDP REMOTE"
            echo "minSdk: 28"
            echo "ABIs: armeabi-v7a + arm64-v8a"
            echo "TV/phone/tablet adaptive UI enabled"
            echo "Strong TV focus selector enabled"
            echo "Save action text visible"
            echo "Connection labels clarified: name, IP/hostname, default port"
            echo "Detailed RDP authentication/network/account failure mapping enabled"
            echo "Failure dialog offers Edit Connection for saved profiles"
            echo "About page simplified to BILLION product/device/version information"
            echo "Developer/debug entry removed from normal connection editor"
            echo "RDP and RemoteApp/RAIL enabled"
            echo "Multiple saved profiles and explicit auto-connect target enabled"
            echo "Boot start optional and independent"
          } > output/BUILD_INFO.txt

      - name: Upload adaptive APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BILLION-RDP-REMOTE-Android9-Adaptive-Test7
          path: output/
          if-no-files-found: error
          retention-days: 30
