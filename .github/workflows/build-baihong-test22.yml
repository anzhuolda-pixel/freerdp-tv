name: Build 百宏RDP Test22 Status Logs APK

on:
  push:
    branches: [ baihong-test22-status-logs ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Test22 build files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and lint Test22
        shell: bash
        run: bash scripts/build_konka_test22.sh

      - name: Upload Test22 APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAIHONG-RDP-KONKA32-Test22
          path: output/
          if-no-files-found: error
          retention-days: 30
