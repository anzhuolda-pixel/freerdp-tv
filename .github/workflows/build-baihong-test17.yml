name: Build 百宏RDP Test17 Android9 Legacy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FREERDP_COMMIT: "50c9f7470d9da3a45e1ebb5ee5fba14140c3fbb3"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      TEST_CERT_SHA256: "373fd206b9067e401b4e9d0d37ace98bf03a8f08b4f1c435af02e5ca5e6e52f4"

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install host build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git perl make ninja-build pkg-config python3 python3-pip autoconf automake libtool gettext zip unzip
          python3 -m pip install --break-system-packages "cryptography==46.0.4"

      - name: Install Android legacy-compatible toolchain
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Checkout pinned FreeRDP source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf upstream
          mkdir upstream
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/FreeRDP/FreeRDP.git
          git -C upstream fetch --depth=1 origin "$FREERDP_COMMIT"
          git -C upstream checkout -q FETCH_HEAD

      - name: Apply Test13 stable UI, 百宏 branding and Test17 legacy runtime patch
        shell: bash
        run: |
          set -euxo pipefail
          for f in \
            patch_freerdp_tv_test3.py \
            patch_adaptive_test4.py \
            patch_brand_ux_test5.py \
            patch_billion_brand_test6.py \
            patch_ux_errors_test7.py \
            patch_remove_about_test8.py \
            patch_tv_focus_display_test9.py \
            patch_stability_test10.py \
            patch_tv_always_on_test11.py \
            patch_tv_remote_hd_test12.py \
            patch_chinese_ui_test13.py \
            patch_baihong_stable_test16.py \
            patch_baihong_legacy_test17.py \
            generate_test_signing.py; do
              python3 -m py_compile "scripts/$f"
          done

          python3 scripts/patch_freerdp_tv_test3.py upstream
          STUDIO=upstream/client/Android/Studio

          # Keep the dependency compatibility shim required by the current pinned FreeRDP tree.
          sed -i 's/^COMPILE_API=.*/COMPILE_API=36/' "$STUDIO/release.properties"
          sed -i 's/^TOOLS_VERSION=.*/TOOLS_VERSION=36.0.0/' "$STUDIO/release.properties"
          sed -i "s/androidx.core:core:1.19.0/androidx.core:core:1.18.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.lifecycle:lifecycle-viewmodel:2.11.0/androidx.lifecycle:lifecycle-viewmodel:2.10.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.lifecycle:lifecycle-livedata:2.11.0/androidx.lifecycle:lifecycle-livedata:2.10.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/sqlcipher-android:4.17.0/sqlcipher-android:4.16.0/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "s/androidx.sqlite:sqlite:2.7.0/androidx.sqlite:sqlite:2.6.2/" "$STUDIO/freeRDPCore/build.gradle"
          sed -i "/implementation project(':freeRDPCore')/a\\    implementation 'androidx.appcompat:appcompat:1.7.1'\n    implementation 'androidx.preference:preference:1.2.1'" "$STUDIO/aFreeRDP/build.gradle"

          python3 scripts/patch_adaptive_test4.py upstream
          python3 scripts/patch_brand_ux_test5.py upstream
          python3 scripts/patch_billion_brand_test6.py upstream
          python3 scripts/patch_ux_errors_test7.py upstream
          python3 scripts/patch_remove_about_test8.py upstream
          python3 scripts/patch_tv_focus_display_test9.py upstream
          python3 scripts/patch_stability_test10.py upstream
          python3 scripts/patch_tv_always_on_test11.py upstream
          python3 scripts/patch_tv_remote_hd_test12.py upstream
          python3 scripts/patch_chinese_ui_test13.py upstream
          python3 scripts/patch_baihong_stable_test16.py upstream
          python3 scripts/patch_baihong_legacy_test17.py upstream

          python3 scripts/generate_test_signing.py "$STUDIO/billion-rdp-test.p12" | tee /tmp/signing.txt
          grep -F "CERT_SHA256=$TEST_CERT_SHA256" /tmp/signing.txt

          # Source-level compatibility gates.
          grep -F "VERSION_NAME=3.31.1-baihong-a9-legacy-test17" "$STUDIO/release.properties"
          grep -F "MIN_API=28" "$STUDIO/release.properties"
          grep -F "TARGET_API=28" "$STUDIO/release.properties"
          grep -F "NDK_VERSION=25.2.9519653" "$STUDIO/release.properties"
          grep -F "CMAKE_VERSION=3.22.1" "$STUDIO/release.properties"
          grep -F -- "-DANDROID_PLATFORM=android-28" "$STUDIO/release.properties"
          grep -F 'android:key="tv.keep_alive"' "$STUDIO/freeRDPCore/src/main/res/xml/settings_app_tv.xml"
          grep -F 'android:defaultValue="true"' "$STUDIO/freeRDPCore/src/main/res/xml/settings_app_tv.xml"
          grep -F 'START_STICKY' "$STUDIO/freeRDPCore/src/main/java/com/freerdp/freerdpcore/services/AppKeepAliveService.java"
          grep -F 'android.permission.FOREGROUND_SERVICE' "$STUDIO/freeRDPCore/src/main/AndroidManifest.xml"
          grep -F 'FreeRDP JNI is deliberately NOT loaded during app startup' "$STUDIO/freeRDPCore/src/main/java/com/freerdp/freerdpcore/application/GlobalApp.java"

      - name: Build release APK
        shell: bash
        working-directory: upstream/client/Android/Studio
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace :aFreeRDP:assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/output/GRADLE_BUILD.txt"
          STATUS=${PIPESTATUS[0]}
          set -e
          exit "$STATUS"

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          STUDIO=upstream/client/Android/Studio
          APK=""
          while IFS= read -r CANDIDATE; do
            if unzip -l "$CANDIDATE" | grep -Fq "lib/arm64-v8a/" && unzip -l "$CANDIDATE" | grep -Fq "lib/armeabi-v7a/"; then
              APK="$CANDIDATE"
              break
            fi
          done < <(find "$STUDIO/aFreeRDP/build/outputs/apk/release" -type f -name '*.apk' | sort)
          test -n "$APK"

          OUT="output/BAIHONG-RDP-3.31.1-Android9-Legacy-Test17.apk"
          cp "$APK" "$OUT"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"

          sha256sum "$OUT" | tee output/SHA256.txt
          "$AAPT" dump badging "$OUT" | tee output/APK_BADGING.txt
          grep -Fq "sdkVersion:'28'" output/APK_BADGING.txt
          grep -Fq "targetSdkVersion:'28'" output/APK_BADGING.txt
          grep -Fq "versionName='3.31.1-baihong-a9-legacy-test17'" output/APK_BADGING.txt
          grep -Fq "application-label:'百宏RDP'" output/APK_BADGING.txt
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee output/APK_SIGNATURE.txt
          grep -Fiq "$TEST_CERT_SHA256" output/APK_SIGNATURE.txt
          "$ZIPALIGN" -c -v 4 "$OUT" >/dev/null
          unzip -t "$OUT" | tee output/APK_ZIP_TEST.txt

          unzip -l "$OUT" | grep -F "lib/arm64-v8a/"
          unzip -l "$OUT" | grep -F "lib/armeabi-v7a/"
          if unzip -l "$OUT" | grep -Eq 'lib/(x86|x86_64)/'; then
            echo "Unexpected x86 ABI in Android TV build" >&2
            exit 1
          fi

          {
            echo "Base: FreeRDP 3.31.1 pinned commit $FREERDP_COMMIT"
            echo "Variant: 百宏RDP Android 9 Legacy Test17"
            echo "minSdk=28; targetSdk=28; ARMv7 + ARM64"
            echo "Native runtime: NDK r25c, CMake 3.22.1, ANDROID_PLATFORM=android-28"
            echo "Startup safety: FreeRDP JNI load deferred until first RDP session"
            echo "AndroidX runtime: conservative Android 9 compatible dependency set"
            echo "Background resident service: default ON, START_STICKY foreground service"
            echo "Boot auto-start: default OFF and user controlled"
            echo "Retained: Test11 always-on, Test12 TV focus/HD, Test13 Chinese UI, stable ListPreference auto-connect delay"
          } > output/BUILD_INFO.txt

      - name: Upload Test17 APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAIHONG-RDP-Android9-Legacy-Test17
          path: output/
          if-no-files-found: error
          retention-days: 30
